name: CI

on:
  push:
    branches:
      # main is where the shipping work actually lands, and it was not in this list — so
      # the branch everything gets pushed to was the one branch CI never ran on.
      #
      # backup/** is the same hole one layer down: the repo's declared PR base is
      # backup/2026-07-02, and it matched none of the patterns here. A base branch with no
      # CI is worse than an untested feature branch — it is what every PR gets compared and
      # merged into, so a break landing there is invisible until it is everywhere.
      - 'main'
      - 'backup/**'
      - 'release/**'
      - 'feat/**'
      - 'fix/**'
      - 'claude/**'
      - 'codex/**'
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  daemon:
    name: daemon (bun/TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Typecheck meshd
        working-directory: install/payload/meshd
        run: |
          # bun-types + typescript are installed ephemerally (--no-save) so this
          # step never writes to the committed package.json/lockfile.
          bun add -D --no-save bun-types "typescript@~5.7.0"
          bun x tsc --noEmit -p tsconfig.json

      # Pure shell/python checks that need no macOS-only tool, rmux, cmux, or a
      # running daemon — each runs against a throwaway HOME/tmp dir. See
      # scripts/check-all.sh for the full (macOS-only) suite these are a subset of.
      - name: check-mesh-self-check.sh
        run: sh scripts/check-mesh-self-check.sh

      - name: check-mesh-input-linux.sh
        run: sh scripts/check-mesh-input-linux.sh

      - name: check-mesh-pair.sh
        run: sh scripts/check-mesh-pair.sh

      - name: check-mesh-push.sh
        run: sh scripts/check-mesh-push.sh

      - name: check-mesh-hooks.sh
        run: sh scripts/check-mesh-hooks.sh

      - name: check-mesh-upgrade.sh
        run: sh scripts/check-mesh-upgrade.sh

      - name: check-mesh-version.sh
        run: sh scripts/check-mesh-version.sh

      - name: check-paste-epipe.sh
        run: sh scripts/check-paste-epipe.sh

      - name: check-mesh-uninstall.sh
        run: sh scripts/check-mesh-uninstall.sh

      - name: check-install-idempotent.sh
        run: sh scripts/check-install-idempotent.sh

      - name: check-host-guard.sh
        run: sh scripts/check-host-guard.sh

      - name: check-token-rotate.sh
        run: sh scripts/check-token-rotate.sh

      - name: check-mesh-onboarding.sh
        run: sh scripts/check-mesh-onboarding.sh

      - name: check-pair-qr.sh
        run: sh scripts/check-pair-qr.sh

      - name: check-wol.sh
        run: sh scripts/check-wol.sh

      - name: check-package-mesh-install.sh
        run: sh scripts/check-package-mesh-install.sh

      - name: check-mesh-hook.py
        run: python3 scripts/check-mesh-hook.py

      # The install one-liner and the TestFlight link are the whole front door, and both have
      # rotted silently before — mesh.lesearch.ai once had no DNS at all while the README
      # kept telling people to curl it. MESH_LINKS_REQUIRED=1 because a GitHub runner with no
      # network is a broken runner, never a laptop on a plane: offline must fail here, not skip.
      - name: check-links.sh (the published install + TestFlight links resolve)
        run: MESH_LINKS_REQUIRED=1 sh scripts/check-links.sh

  apps:
    name: apps (Xcode)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # scripts/check-ios-smoke.sh exits 0 with a SKIP when the machine has no simulator new
      # enough to install the app. On a laptop that is honest. Here it is a lie by omission:
      # a green `apps` job would mean "the app was never launched" and read as "the app is
      # fine" — the exact shape of the 0.5.0 release, where every static check passed while
      # the app died on every screen with a text field. Strict mode turns that skip into a
      # failure, so if the runner image ever loses its iOS simulators, CI says so loudly
      # instead of quietly stopping doing the one check that runs the code.
      MESH_SMOKE_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install bun (for the daemon self-checks)
        uses: oven-sh/setup-bun@v2

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build MeshWatch (iOS)
        run: |
          xcodebuild -project MeshWatch.xcodeproj -scheme "MeshWatch" \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build MeshWatch Watch App
        run: |
          xcodebuild -project MeshWatch.xcodeproj -scheme "MeshWatch Watch App" \
            -destination "generic/platform=watchOS Simulator" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build MeshDesktop (macOS menu bar app)
        run: |
          xcodebuild -project MeshWatch.xcodeproj -scheme "MeshDesktop" \
            -destination "generic/platform=macOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      # This runs check-ios-smoke.sh too — check-all.sh's loop picks up every
      # scripts/check-*.sh. There used to be a separate "Smoke test MeshWatch" step above as
      # well, which meant TWO xcodebuild test runs against the same simulator in one job. The
      # second one gets its test runner killed before it connects, which check-ios-smoke.sh
      # correctly refuses to call either a pass or a failure (INCONCLUSIVE, exit 1) — so the
      # duplicate produced red builds that were nothing but the duplication, and the cure for
      # those is re-running until green, which is how a real crash gets waved through.
      # One invocation. Static checks and the launch, in the one place that owns both.
      - name: Run self-checks (includes the smoke test that launches the app)
        run: sh scripts/check-all.sh
