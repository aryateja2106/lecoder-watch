name: MeshWatch
options:
  bundleIdPrefix: com.lecoder.meshwatch
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: NO
    DEVELOPMENT_TEAM: "B5B87F7AXF"
    CODE_SIGN_STYLE: Automatic
schemes:
  MeshWatch:
    build:
      targets:
        MeshWatch: all
    test:
      targets:
        - MeshWatchUITests
    run:
      config: Debug
  MeshWatch Watch App:
    build:
      targets:
        MeshWatch Watch App: all
    run:
      config: Debug
targets:
  MeshWatch:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
    info:
      path: Generated/iOS-Info.plist
      properties:
        CFBundleDisplayName: MeshWatch
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: "MeshWatch connects to your machines over your private Tailscale network."
        NSMicrophoneUsageDescription: "Dictate commands to your agents."
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.lecoder.meshwatch
            CFBundleURLSchemes:
              - meshwatch
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lecoder.meshwatch
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: MeshWatch Watch App
        embed: true
      - target: MeshWatchWidgets
        embed: true
  MeshWatchWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: MeshWatchWidgets
    info:
      path: MeshWatchWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lecoder.meshwatch.widgets
        INFOPLIST_KEY_CFBundleDisplayName: MeshWatch Sessions
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
  MeshWatchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MeshWatchUITests
    info:
      path: MeshWatchUITests/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lecoder.meshwatch.uitests
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: MeshWatch
    dependencies:
      - target: MeshWatch
  MeshWatch Watch App:
    type: application
    platform: watchOS
    sources:
      - path: Shared
      - path: Watch
    info:
      path: Generated/Watch-Info.plist
      properties:
        CFBundleDisplayName: MeshWatch
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.lecoder.meshwatch
        NSMicrophoneUsageDescription: "Dictate commands to your agents."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lecoder.meshwatch.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
