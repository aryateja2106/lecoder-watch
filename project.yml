name: MeshWatch
options:
  bundleIdPrefix: com.lecoder.meshwatch
  deploymentTarget:
    iOS: "26.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: NO
    DEVELOPMENT_TEAM: "B5B87F7AXF"
    CODE_SIGN_STYLE: Automatic
schemes:
  MeshWatch:
    build:
      targets:
        MeshWatch: all
    run:
      config: Debug
  MeshWatch Watch App:
    build:
      targets:
        MeshWatch Watch App: all
    run:
      config: Debug
targets:
  MeshWatch:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
      - path: Assets.xcassets
    info:
      path: Generated/iOS-Info.plist
      properties:
        CFBundleDisplayName: LeSearch Mesh
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: "MeshWatch connects to your machines over your private Tailscale network."
        NSMicrophoneUsageDescription: "Dictate commands to your agents."
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.lecoder.meshwatch
            CFBundleURLSchemes:
              - meshwatch
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lecoder.meshwatch
        CODE_SIGN_ENTITLEMENTS: iOS/MeshWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: MeshWatch Watch App
        embed: true
      - target: MeshWatchWidgets
        embed: true
  MeshWatchWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Shared
      - path: MeshWatchWidgets
    info:
      path: MeshWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: LeSearch Mesh Sessions
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lecoder.meshwatch.widgets
        # "1" and not "1,2": an iPad-capable target must declare all four orientations
        # or App Store Connect rejects the build with 90474. Learned the expensive way.
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
  MeshWatch Watch App:
    type: application
    platform: watchOS
    sources:
      - path: Shared
      - path: Watch
      - path: Assets.xcassets
    info:
      path: Generated/Watch-Info.plist
      properties:
        CFBundleDisplayName: LeSearch Mesh
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.lecoder.meshwatch
        NSMicrophoneUsageDescription: "Dictate commands to your agents."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lecoder.meshwatch.watchkitapp
        CODE_SIGN_ENTITLEMENTS: Watch/MeshWatchWatch.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
    dependencies:
      - target: WatchWidgets
        embed: true
  WatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: Shared
      - path: WatchWidgets
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Agents waiting
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lecoder.meshwatch.watchkitapp.glance
        CODE_SIGN_ENTITLEMENTS: WatchWidgets/WatchWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
