# Run meshd on a Linux host or VPS. Pair from the container with:
#   docker compose exec meshd mesh pair --address <tailscale-or-lan-ip>
#
# Uninstall: docker compose down -v   (removes the persisted volume)
#
# The container runs as uid 1000 (mesh). A bind-mounted /data must be writable
# by that uid. Named volumes created by compose inherit the image ownership.
services:
  meshd:
    build: .
    image: meshd:local
    container_name: meshd
    ports:
      - "${MESHD_PORT:-8899}:8899"
    volumes:
      - mesh-data:/data
    environment:
      MESHD_HOST: "0.0.0.0"
      MESHD_PORT: "8899"
      MESH_MUX: "tmux"
      HOME: "/data"
      MESH_HOME: "/data/.mesh"
      # Explicit marker so /health does not advertise desktop input/screen in a container.
      MESHD_CONTAINER: "1"
      # Set to "off" to disable the daily anonymized heartbeat (see README Telemetry).
      MESHD_TELEMETRY: "${MESHD_TELEMETRY:-on}"
      # Optional: pin a token instead of letting the entrypoint mint one on first boot.
      # MESHD_TOKEN: ""
    user: "1000:1000"
    mem_limit: 256m
    cpus: "0.5"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8899/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mesh-data:
