          - heading "Supervise a reachable Linux machine from iPhone and Apple Watch" [level=1] [ref=f12e16]
          - paragraph [ref=f12e17]: Use the iPhone for terminal detail and the Watch for status and short replies while a Linux machine you own does the work.
