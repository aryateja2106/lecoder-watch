          - heading "Current public beta" [level=2] [ref=f5e19]
          - paragraph [ref=f5e20]: Mesh keeps execution on machines you own and puts supervision on iPhone and Apple Watch. The Watch relays through its paired iPhone; it is not a direct machine connection.
          - list [ref=f5e21]:
            - listitem [ref=f5e22]: Native iPhone and Apple Watch apps.
            - listitem [ref=f5e23]: Pair owned macOS and Linux machines with a temporary code or QR link.
            - listitem [ref=f5e24]: See machine reachability, health, sessions, events, and provider usage limits.
            - listitem [ref=f5e25]: Read session output, send text or key input, and start or stop supported terminal sessions from iPhone.
            - listitem [ref=f5e26]: See machine and session state on Apple Watch, then send short replies through the paired iPhone.
            - listitem [ref=f5e27]: Use iPhone remote screen, trackpad, and keyboard controls when the host supports them.
            - listitem [ref=f5e28]: Connect over a reachable LAN or Tailscale network, including the local flow without a LeSearch AI account.
