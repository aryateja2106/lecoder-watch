  - generic [ref=e123]:
    - text: On your wrist
    - heading "Built watch-first, not watch-also." [level=2] [ref=e124]
    - paragraph [ref=e125]: Most tools in this space treat the watch as a notification mirror. Here it is the primary surface, and the phone is the thing that keeps it fed.
    - generic [ref=e126]:
      - generic [ref=e127]:
        - generic [ref=e128]: Complication
        - heading "A count on your watch face" [level=3] [ref=e129]
        - paragraph [ref=e130]: How many agents are waiting on you, all day, in every accessory family. When nothing is waiting it shows how much of your mesh is up — and it tells you when the reading has gone stale instead of quietly lying.
      - generic [ref=e131]:
        - generic [ref=e132]: Notifications
        - heading "Answerable, not just readable" [level=3] [ref=e133]
        - paragraph [ref=e134]: Continue, Stop, or dictate a Reply straight from the notification. The reply is typed into the real session on the real machine — and once the task is done, the banner takes itself down.
      - generic [ref=e135]:
        - generic [ref=e136]: Live Activity
        - heading "Lock Screen and Dynamic Island" [level=3] [ref=e137]
        - paragraph [ref=e138]: The one session that actually needs you, live on the Lock Screen and in the Smart Stack — with how much of your fleet is online next to it. Blocked always outranks merely busy.
      - generic [ref=e139]:
        - generic [ref=e140]: Terminal
        - heading "A real terminal, on a watch" [level=3] [ref=e141]
        - paragraph [ref=e142]: Crown to scroll, auto-follow at the tail, a key bar for the characters a watch keyboard will not give you, and full VoiceOver.
      - generic [ref=e143]:
        - generic [ref=e144]: Mac control
        - heading "Mouse, keyboard, screen" [level=3] [ref=e145]
        - paragraph [ref=e146]: Drive the Mac itself across multiple displays — trackpad-style pointer with pinch-to-zoom, sticky modifiers so ⌘⇧4 works, paste both ways, and a live screen view — when answering a question is not enough.
      - generic [ref=e147]:
