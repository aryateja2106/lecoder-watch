  - generic [ref=e153]:
    - text: Local-first, and it matters
    - heading "There is no cloud in the middle." [level=2] [ref=e154]
    - paragraph [ref=e155]: The comparable tools relay your sessions through their servers. That is the easy way to build this, and it means your terminal output, your prompts and your source code pass through somebody else's machine.
    - generic [ref=e156]:
      - generic [ref=e157]:
        - generic [ref=e158]: Where your data goes
        - generic [ref=e159]:
          - text: Phone → your machine, directly, over your own private network. We run no relay, so your terminal output and your code never reach us. The one thing that does is a daily count from the daemon — version, platform, uptime — which you can switch off.
          - link "The exact payload" [ref=e160] [cursor=pointer]:
            - /url: /privacy
          - text: .
      - generic [ref=e161]:
        - generic [ref=e162]: What an account costs you
        - generic [ref=e163]: There is no account. No email, no OAuth, no team seat. Pairing is a code your own machine printed.
      - generic [ref=e164]:
        - generic [ref=e165]: How access is gated
        - generic [ref=e166]: A per-machine bearer token, minted by that machine, plus whatever network you already trust — your Tailscale ACL or your LAN. Nothing is port-forwarded and nothing is exposed to the public internet.
      - generic [ref=e167]:
        - generic [ref=e168]: If this project disappears
        - generic [ref=e169]: The daemon keeps running and the source stays public. It is your machine, your token, and a plain HTTP API you can curl.
