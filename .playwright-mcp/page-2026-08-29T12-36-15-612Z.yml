    - heading "Three commands and an eight-character code." [level=2] [ref=e91]
    - paragraph [ref=e92]:
      - text: There is no signup, no dashboard and no server of ours in the path. You install a small daemon on a machine you own, and your phone pairs with it directly. Or run
      - code [ref=e93]: mesh setup
      - text: and let it walk you through permissions, pairing, and hooks.
